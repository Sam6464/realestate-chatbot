<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estate Assistant: Dar Global and Wasalt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1f3a'/%3E%3Cpath d='M6 16 16 7l10 9v9H6z' fill='%23c9a227'/%3E%3C/svg%3E">
<style>
:root {
  --bg:#f6f4ee; --surface:#ffffff; --text:#14213a; --muted:#667085; --border:#e3ded0;
  --navy:#0b1f3a; --navy2:#17335c; --gold:#c9a227; --gold-soft:#f5ecc9;
  --user-bg:#0b1f3a; --user-text:#ffffff; --shadow:0 1px 2px rgba(11,31,58,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#07111f; --surface:#102039; --text:#e8ecf4; --muted:#98a4bb; --border:#22324d;
    --navy:#0a1930; --navy2:#1b3a68; --gold:#d9b43c; --gold-soft:#2b2610;
    --user-bg:#d9b43c; --user-text:#0b1f3a; --shadow:none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; height: 100dvh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px);
}
header {
  background: var(--navy); color: #fff; padding: 14px 20px;
  border-bottom: 3px solid var(--gold);
}
.bar { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; flex: none; }
.titles { flex: 1; min-width: 0; }
.titles h1 { margin: 0; font: 600 21px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .2px; }
.titles p { margin: 2px 0 0; font-size: 13px; color: #c5cde0; }
#newchat {
  background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
}
#newchat:hover { border-color: var(--gold); color: var(--gold); }
#chat { flex: 1; overflow-y: auto; padding: 22px 16px 8px; }
.col { max-width: 860px; margin: 0 auto; }
.msg { display: flex; flex-direction: column; margin: 12px 0; }
.msg.user { align-items: flex-end; }
.msg.bot { align-items: flex-start; }
.bubble {
  max-width: min(100%, 680px); padding: 11px 15px; border-radius: 16px; font-size: 15.5px;
  word-wrap: break-word; overflow-wrap: anywhere;
}
.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
.bot .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
.bubble li { margin: 3px 0; }
.bubble code { background: var(--gold-soft); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 7px 2px 0; max-width: 680px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; max-width: 250px; padding: 4px 11px 4px 5px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  color: var(--text); font-size: 12.5px; text-decoration: none;
}
.chip:hover { border-color: var(--gold); }
.chip b {
  width: 19px; height: 19px; flex: none; display: grid; place-items: center; border-radius: 50%;
  background: var(--navy); color: var(--gold); font-size: 11px; font-weight: 700;
}
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act {
  background: none; border: 0; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 3px 6px; border-radius: 6px;
}
.act:hover { color: var(--text); background: var(--gold-soft); }
.typing { display: flex; align-items: center; gap: 5px; padding: 4px 2px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: bounce 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-6px); opacity: 1; } }
.wake { margin-top: 8px; font-size: 13px; color: var(--muted); }
.welcome { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.welcome h2 { margin: 0 0 6px; font: 600 20px/1.3 Georgia, "Times New Roman", serif; }
.welcome > p { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; }
.group { margin-top: 14px; }
.group h3 { margin: 0 0 7px; font-size: 14px; font-weight: 600; color: var(--navy2); }
@media (prefers-color-scheme: dark) { .group h3 { color: var(--gold); } }
.ex { display: flex; flex-wrap: wrap; gap: 8px; }
.ex button {
  border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 10px;
  padding: 8px 12px; font-size: 14px; cursor: pointer; text-align: left;
}
.ex button:hover { border-color: var(--gold); background: var(--gold-soft); }
.limits { margin-top: 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
form { display: flex; gap: 8px; padding: 10px 16px 6px; max-width: 892px; width: 100%; margin: 0 auto; }
input {
  flex: 1; min-width: 0; padding: 13px 15px; font-size: 16px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; outline: none;
}
input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
#send {
  padding: 0 22px; border: 0; border-radius: 12px; background: var(--gold); color: #0b1f3a;
  font-size: 15px; font-weight: 600; cursor: pointer;
}
#send:disabled { opacity: .45; cursor: default; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
footer { text-align: center; font-size: 11.5px; color: var(--muted); padding: 2px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 520px) {
  header { padding: 12px 14px; } .titles h1 { font-size: 18px; } .titles p { display: none; }
  .bubble { font-size: 15px; } #send { padding: 0 16px; }
}
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: pulse 1.4s infinite ease-in-out; } }
.typing .t { margin-left: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timer { font-size: 12.5px; color: var(--muted); padding: 0 4px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg class="logo" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="9" fill="#17335c"/><path d="M7 19 19 8l12 11v12H7z" fill="#c9a227"/><rect x="16" y="21" width="6" height="10" fill="#0b1f3a"/></svg>
    <div class="titles"><h1>Estate Assistant</h1><p>Ask about Dar Global projects and Wasalt listings</p></div>
    <button id="newchat" type="button">New chat</button>
  </div>
</header>
<div id="chat"><div class="col" id="col"></div></div>
<form id="form">
  <input id="input" placeholder="Ask about a project, city or property..." autocomplete="off" aria-label="Your question" enterkeyhint="send">
  <button id="send" type="submit">Send</button>
</form>
<footer>Answers come from public pages of darglobal.co.uk and wasalt.sa and may be out of date. Prices and availability may have changed. Wasalt data: Source: Wasalt.sa</footer>

<script>
const col = document.getElementById("col"), chat = document.getElementById("chat");
const form = document.getElementById("form"), input = document.getElementById("input"), send = document.getElementById("send");
let history = [], busy = false;

const EXAMPLES = {
  "Dar Global projects": ["What projects does Dar Global have in Oman?", "Tell me about AIDA 360", "Tell me about the Marea project"],
  "Wasalt listings": ["Show me apartments for sale in Riyadh with 3 bedrooms", "Any villas for sale in Jeddah?"],
  "About the company": ["Who is the CEO of Dar Global?"]
};

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<i>$2</i>").replace(/`(.+?)`/g, "<code>$1</code>");
}
function md(text) {
  let out = "", list = null;
  const close = () => { if (list) { out += "</" + list + ">"; list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const ul = line.match(/^[-*\u2022]\s+(.*)/), ol = line.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (list !== tag) { close(); out += "<" + tag + ">"; list = tag; }
      out += "<li>" + inline((ul || ol)[1]) + "</li>";
    } else { close(); if (line) out += "<p>" + inline(line) + "</p>"; }
  }
  close();
  return out;
}
function scroll() { chat.scrollTop = chat.scrollHeight; }

function showWelcome() {
  const w = document.createElement("div");
  w.className = "welcome"; w.id = "welcome";
  let html = "<h2>What would you like to know?</h2><p>I can look up Dar Global developments and Wasalt property listings in Saudi Arabia, and I’ll show where each answer came from.</p>";
  for (const [name, qs] of Object.entries(EXAMPLES)) {
    html += `<div class="group"><h3>${esc(name)}</h3><div class="ex">` + qs.map(q => `<button type="button">${esc(q)}</button>`).join("") + "</div></div>";
  }
  html += '<div class="limits">I only know what is on those two websites. If something isn’t there, I’ll say so rather than guess.</div>';
  w.innerHTML = html;
  w.querySelectorAll(".ex button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
  col.appendChild(w);
}

function addUser(q) {
  const m = document.createElement("div"); m.className = "msg user";
  m.innerHTML = '<div class="bubble">' + esc(q) + "</div>";
  col.appendChild(m); scroll();
}
function addTyping() {
  const m = document.createElement("div"); m.className = "msg bot";
  m.innerHTML = '<div class="bubble"><div class="typing" aria-label="Assistant is typing"><i></i><i></i><i></i><span class="t">Thinking 0s</span></div></div>';
  col.appendChild(m); scroll(); return m;
}
function chipLabel(s) {
  let t = (s.title || "").split("|")[0].split(" - ")[0].replace(/\(.*?\)/g, "").trim();
  if (!t) t = s.url.replace(/^https?:\/\/(www\.)?/, "");
  return t.length > 36 ? t.slice(0, 35) + "\u2026" : t;
}
function addBot(answer, sources, failedQ, secs) {
  const m = document.createElement("div"); m.className = "msg bot";
  const b = document.createElement("div"); b.className = "bubble";
  m.appendChild(b);
  const tools = document.createElement("div"); tools.className = "tools";
  if (failedQ) {
    const r = document.createElement("button"); r.className = "act"; r.textContent = "Retry";
    r.addEventListener("click", () => { m.remove(); ask(failedQ, true); }); tools.appendChild(r);
  } else {
    const seen = new Set();
    (sources || []).filter(s => s.url && !seen.has(s.url) && seen.add(s.url)).slice(0, 3).forEach(s => {
      const a = document.createElement("a"); a.className = "chip"; a.href = s.url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = "<b>" + (s.source === "Wasalt" ? "W" : "D") + "</b><span>" + esc(chipLabel(s)) + "</span>";
      a.title = s.url; tools.appendChild(a);
    });
    const c = document.createElement("button"); c.className = "act"; c.textContent = "Copy";
    c.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(answer); c.textContent = "Copied"; }
      catch (e) { c.textContent = "Press Ctrl+C to copy"; }
      setTimeout(() => c.textContent = "Copy", 1800);
    });
    tools.appendChild(c);
  }
  if (secs != null) {
    const t = document.createElement("span"); t.className = "timer";
    t.textContent = "Answered in " + secs + "s"; tools.appendChild(t);
  }
  col.appendChild(m);
  if (secs == null) { b.innerHTML = md(answer); m.appendChild(tools); scroll(); return Promise.resolve(); }
  return new Promise(done => {
    const parts = answer.split(/(\s+)/); let n = 0;
    const step = () => {
      n = Math.min(parts.length, n + 6);
      let p = parts.slice(0, n).join("");
      if ((p.match(/\*\*/g) || []).length % 2) p += "**";
      b.innerHTML = md(p); scroll();
      if (n < parts.length) setTimeout(step, 30);
      else { m.appendChild(tools); scroll(); done(); }
    };
    step();
  });
}

async function ask(q, isRetry) {
  if (busy) return;
  busy = true; send.disabled = true;
  document.getElementById("welcome")?.remove();
  if (!isRetry) addUser(q);
  const typing = addTyping();
  const t0 = Date.now();
  const tick = setInterval(() => {
    const s = typing.querySelector(".t");
    if (s) s.textContent = "Thinking " + Math.floor((Date.now() - t0) / 1000) + "s";
  }, 1000);
  const wake = setTimeout(() => {
    const p = document.createElement("div"); p.className = "wake";
    p.textContent = "Still working. The server may be waking up, so the first answer can take up to a minute.";
    typing.querySelector(".bubble").appendChild(p); scroll();
  }, 8000);
  const ctrl = new AbortController(), kill = setTimeout(() => ctrl.abort(), 120000);
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, history }), signal: ctrl.signal
    });
    const data = await r.json();
    const secs = Math.round((Date.now() - t0) / 1000);
    clearInterval(tick); clearTimeout(wake);
    typing.remove();
    if (/models are busy/i.test(data.answer || "")) {
      addBot("The AI models are busy right now. Try again in a moment.", [], q);
    } else {
      await addBot(data.answer, data.sources, null, secs);
      history.push({ role: "user", content: q }, { role: "assistant", content: data.answer });
      history = history.slice(-8);
    }
  } catch (e) {
    clearInterval(tick);
    typing.remove();
    addBot("The connection failed or timed out. Check your internet and try again.", [], q);
  }
  clearTimeout(wake); clearTimeout(kill);
  busy = false; send.disabled = false; input.focus();
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || busy) return;
  input.value = ""; ask(q);
});
document.getElementById("newchat").addEventListener("click", () => {
  if (busy) return;
  history = []; col.innerHTML = ""; showWelcome(); input.focus();
});
showWelcome();
</script>
</body>
</html>
